<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9f9f9" />
    <meta name="description" content="Offline-first personal password vault built with React and Vite." />
    <meta property="og:title" content="passwordmanager" />
    <meta property="og:description" content="Offline-first personal password vault built with React and Vite." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="passwordmanager" />
    <meta name="twitter:description" content="Offline-first personal password vault built with React and Vite." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Contras" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.json" />
    <title>Contras</title>
    <style>
      body {
        margin: 0;
        background-color: #f9f9f9;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0f0f10;
        }
      }
      .preloader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100dvh;
        width: 100vw;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      .preloader-logo {
        width: 72px;
        height: 72px;
        margin-bottom: 24px;
        animation: preloader-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        border-radius: 18px;
        box-shadow: 0 12px 32px rgba(0,0,0,0.08);
      }
      @media (prefers-color-scheme: dark) {
        .preloader-logo {
          box-shadow: 0 12px 32px rgba(255,255,255,0.03);
        }
      }
      .preloader-text {
        font-size: 12px;
        font-weight: 700;
        color: #888;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      @media (prefers-color-scheme: dark) {
        .preloader-text {
          color: #6b6b70;
        }
      }
      @keyframes preloader-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.92); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="preloader-container">
        <img src="/icon-192.png" alt="Contras" class="preloader-logo" />
        <div class="preloader-text">Cargando</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
