version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: 09:00
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      - dependency-name: '*vitest*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps):'
    groups:
      all-dependencies:
        patterns:
          - '*'
